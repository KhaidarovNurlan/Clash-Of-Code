spring.application.name=server
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://localhost:5432/clashofcode
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

onecompiler.api.url=https://onecompiler-apis.p.rapidapi.com/api/v1/run
onecompiler.api.host=onecompiler-apis.p.rapidapi.com

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
onecompiler.api.key=${ONECOMPILER_KEY}

jwt.expiration-ms=604800000

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=${MAILTRAP_USERNAME}
spring.mail.password=${MAILTRAP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.from=noreply@clashofcode.com